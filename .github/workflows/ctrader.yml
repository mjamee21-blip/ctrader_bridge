name: cTrader Bot & Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Unified Trading Bot & Dashboard Generator
        env:
          MODE: bot
          CT_CLIENT_ID: ${{ secrets.CT_CLIENT_ID }}
          CT_CLIENT_SECRET: ${{ secrets.CT_CLIENT_SECRET }}
          CT_ACCESS_TOKEN: ${{ secrets.CT_ACCESS_TOKEN }}
          CT_ACCOUNT_ID: ${{ secrets.CT_ACCOUNT_ID }}
          CT_ENV: ${{ secrets.CT_ENV }}
          CL_REFRESH_TOKEN: ${{ secrets.CL_REFRESH_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          echo "Starting Unified Trading Bot & Dashboard Generator..."
          python3 ctrader_bot.py
          echo "Unified cycle completed successfully!"
      
      - name: Commit and Push Dashboard
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Dashboard Bot"
          git add docs/ || true
          git commit -m "Dashboard & Bot Update: $(date -u '+%Y-%m-%d %H:%M UTC')" || true
          git push || true
      
      - name: Report Execution Status
        if: always()
        run: |
          echo "✅ Workflow execution completed"
          if [ -f docs/system_state.json ]; then
            echo "📊 System state saved"
          fi
          if [ -f docs/index.html ]; then
            echo "📈 Dashboard generated"
          fi
