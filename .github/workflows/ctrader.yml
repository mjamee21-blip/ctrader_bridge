name: cTrader FIX API Trading Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-bot]

permissions:
  contents: write

concurrency:
  group: ctrader-bot
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --quiet

      - name: Validate secrets
        run: |
          [ -z "${{ secrets.FIX_HOST }}" ] && echo "ERROR: FIX_HOST not set" && exit 1
          [ -z "${{ secrets.FIX_PASSWORD }}" ] && echo "ERROR: FIX_PASSWORD not set" && exit 1
          [ -z "${{ secrets.FIX_SENDER_COMP_ID }}" ] && echo "ERROR: FIX_SENDER_COMP_ID not set" && exit 1
          echo "✓ All secrets validated"

      - name: Run Trading Bot
        env:
          FIX_HOST: ${{ secrets.FIX_HOST }}
          FIX_TRADE_PORT: ${{ secrets.FIX_TRADE_PORT || '5212' }}
          FIX_QUOTE_PORT: ${{ secrets.FIX_QUOTE_PORT || '5211' }}
          FIX_SENDER_COMP_ID: ${{ secrets.FIX_SENDER_COMP_ID }}
          FIX_TARGET_COMP_ID: ${{ secrets.FIX_TARGET_COMP_ID || 'cServer' }}
          FIX_SENDER_SUB_ID: ${{ secrets.FIX_SENDER_SUB_ID || 'TRADE' }}
          FIX_PASSWORD: ${{ secrets.FIX_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          CTRADER_DEFAULT_QTY: ${{ secrets.CTRADER_DEFAULT_QTY || '1.0' }}
        run: |
          echo "🤖 Starting cTrader FIX API Bot..."
          python3 ctrader_bot.py
          echo "✓ Bot cycle completed"

      - name: Commit and Push Updates
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "cTrader Bot"
          git add -A 2>/dev/null || true
          git commit -m "Bot Update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" 2>/dev/null || echo "Nothing to commit"
          git push origin main 2>/dev/null || echo "Push failed (nothing to push)"

      - name: Upload Dashboard Assets
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: dashboard-state
          path: |
            system_state.json
            heartbeat.log
          retention-days: 7
