name: cTrader Bot & Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctrader-bot
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies (cached)
        run: pip install -r requirements.txt
      
      - name: Run Trading Bot Cycle
        env:
          MODE: bot
          FIX_HOST: ${{ secrets.FIX_HOST }}
          FIX_TRADE_PORT: ${{ secrets.FIX_TRADE_PORT }}
          FIX_SENDER_COMP_ID: ${{ secrets.FIX_SENDER_COMP_ID }}
          FIX_TARGET_COMP_ID: ${{ secrets.FIX_TARGET_COMP_ID }}
          FIX_SENDER_SUB_ID: ${{ secrets.FIX_SENDER_SUB_ID }}
          FIX_PASSWORD: ${{ secrets.FIX_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          echo "Starting Trading Bot..."
          python3 ctrader_bot.py
          echo "Bot execution completed"
      
      - name: Generate Dashboard HTML
        env:
          MODE: dashboard
          FIX_HOST: ${{ secrets.FIX_HOST }}
          FIX_TRADE_PORT: ${{ secrets.FIX_TRADE_PORT }}
          FIX_SENDER_COMP_ID: ${{ secrets.FIX_SENDER_COMP_ID }}
          FIX_TARGET_COMP_ID: ${{ secrets.FIX_TARGET_COMP_ID }}
          FIX_SENDER_SUB_ID: ${{ secrets.FIX_SENDER_SUB_ID }}
          FIX_PASSWORD: ${{ secrets.FIX_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          echo "Generating Dashboard..."
          python3 ctrader_bot.py
          echo "Dashboard generation completed"
      
      - name: Commit and Push Dashboard
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Dashboard Bot"
          git add docs/ || true
          git commit -m "Dashboard & Bot Update: $(date -u '+%Y-%m-%d %H:%M UTC')" || true
          git push || true
      
      - name: Report Execution Status
        if: always()
        run: |
          echo "✅ Workflow execution completed"
          if [ -f docs/system_state.json ]; then
            echo "📊 System state saved"
          fi
          if [ -f docs/index.html ]; then
            echo "📈 Dashboard generated"
          fi
