name: cTrader OpenAPI Trading Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-bot]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: ctrader-bot
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        run: |
          [ -z "${{ secrets.CT_CLIENT_ID }}" ] && echo "ERROR: CT_CLIENT_ID not set" && exit 1
          [ -z "${{ secrets.CT_ACCESS_TOKEN }}" ] && echo "ERROR: CT_ACCESS_TOKEN not set" && exit 1
          [ -z "${{ secrets.CT_ACCOUNT_ID }}" ] && echo "ERROR: CT_ACCOUNT_ID not set" && exit 1
          echo "✓ All required cTrader OpenAPI secrets validated"

      - name: Run Trading Bot
        id: run_bot
        env:
          CT_CLIENT_ID: ${{ secrets.CT_CLIENT_ID }}
          CT_CLIENT_SECRET: ${{ secrets.CT_CLIENT_SECRET }}
          CT_ACCESS_TOKEN: ${{ secrets.CT_ACCESS_TOKEN }}
          CT_ACCOUNT_ID: ${{ secrets.CT_ACCOUNT_ID }}
          CT_ENV: ${{ secrets.CT_ENV || 'demo' }}
          TG_TOKEN: ${{ secrets.TG_TOKEN || '' }}
          TG_CHAT: ${{ secrets.TG_CHAT || '' }}
        run: |
          echo "🤖 Starting cTrader OpenAPI Bot..."
          python3 ctrader_bot.py
          BOT_EXIT_CODE=$?
          echo "bot_exit_code=$BOT_EXIT_CODE" >> $GITHUB_OUTPUT
          
          if [ $BOT_EXIT_CODE -eq 0 ]; then
            echo "✅ Bot cycle completed successfully"
            exit 0
          else
            echo "❌ Bot cycle failed with exit code: $BOT_EXIT_CODE"
            exit $BOT_EXIT_CODE
          fi

      - name: Check and Move State Files
        if: always()
        run: |
          echo "📁 Organizing output files..."
          if [ -f "docs/system_state.json" ]; then
            cp docs/system_state.json system_state.json
            echo "✓ State file copied to root"
          else
            mkdir -p docs
            echo '{"status":"no-connection","lastUpdate":"'$(date -u '+%Y-%m-%dT%H:%M:%SZ'):'"}' > system_state.json
          fi
          echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Bot cycle completed (exit: ${{ steps.run_bot.outputs.bot_exit_code }})" > heartbeat.log

      - name: Inject Dashboard Credentials
        if: always()
        env:
          DASHBOARD_USER: ${{ secrets.DASHBOARD_USER }}
          DASHBOARD_PASS: ${{ secrets.DASHBOARD_PASS }}
        run: |
          USER="${DASHBOARD_USER:-admin}"
          PASS="${DASHBOARD_PASS:-password123}"
          if [ -f "docs/login.html" ]; then
            sed -i "s/__DASHBOARD_USER__/$USER/g" docs/login.html
            sed -i "s/__DASHBOARD_PASS__/$PASS/g" docs/login.html
            echo "✓ Dashboard credentials injected into login.html"
          fi

      - name: Commit and Push Updates
        if: always()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add -A 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit"
          else
            git commit -m "Bot Update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || true
            git push origin HEAD:main 2>/dev/null || echo "⚠️  Push failed (likely no new commits)"
          fi

      - name: Upload Dashboard Assets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-state
          path: |
            system_state.json
            heartbeat.log
          retention-days: 7
          if-no-files-found: warn

      - name: Job Summary
        if: always()
        run: |
          echo "## cTrader OpenAPI Bot Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Exit Code:** ${{ steps.run_bot.outputs.bot_exit_code }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "system_state.json" ]; then
            echo "**Last State:** " >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            head -20 system_state.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
