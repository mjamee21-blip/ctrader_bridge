name: Deploy PipBridge Site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Inject credentials & link config from GitHub secrets
        env:
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          CT_CLIENT_ID: ${{ secrets.CT_CLIENT_ID }}
        run: |
          python3 << 'EOF'
          import os
          path = 'index.html'
          html = open(path, encoding='utf-8').read()
          user = os.environ.get('DASHBOARD_USERNAME', '').strip()
          pwd  = os.environ.get('DASHBOARD_PASSWORD', '').strip()
          if not user or not pwd:
              print('⚠️  DASHBOARD_USERNAME / DASHBOARD_PASSWORD secrets are not set. Admin login will be disabled.')
          else:
              html = html.replace('%%DASHBOARD_USERNAME%%', user).replace('%%DASHBOARD_PASSWORD%%', pwd)
              print('✅ Admin credentials injected.')
          bot = os.environ.get('BOT_USERNAME', '').strip()
          if bot:
              html = html.replace('%%BOT_USERNAME%%', bot)
              print('✅ Bot username injected:', bot)
          cid = os.environ.get('CT_CLIENT_ID', '').strip()
          if cid:
              html = html.replace('%%CT_CLIENT_ID%%', cid)
              print('✅ cTrader client id injected (real OAuth linking enabled).')
          open(path, 'w', encoding='utf-8').write(html)
          EOF

      - name: Stage site (index.html only)
        run: |
          mkdir -p site
          cp index.html site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
