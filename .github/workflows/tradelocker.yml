name: TradeLocker Bot & Dashboard

on:
  schedule:
    # Bot: Run every :03 and :33 (trading signals)
    - cron: '3,33 * * * *'
    # Dashboard: Run every :00 and :30 (updates every 30 min)
    - cron: '0,30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

# Allow the workflow to push to the repo and deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # =================================================================
  # JOB 1: Trading Bot (reads Telegram signals, places orders)
  # =================================================================
  bot:
    runs-on: ubuntu-latest
    name: Execute Trading Bot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # Explicitly check out the triggering branch

      # 🔍 DEBUG: List all files to see what was checked out
      - name: 🔍 Debug - List files in workspace
        run: |
          echo "=== Current branch ==="
          git branch --show-current
          echo ""
          echo "=== All files in workspace ==="
          ls -la
          echo ""
          echo "=== Searching for python files ==="
          find . -name "*.py" -type f
          echo ""
          echo "=== GitHub ref ==="
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Trading Bot
        env:
          MODE: bot
          TL_EMAIL: ${{ secrets.TL_EMAIL }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_SERVER: ${{ secrets.TL_SERVER }}
          TL_ACCOUNT_ID: ${{ secrets.TL_ACCOUNT_ID }}
          TL_ACC_NUM: ${{ secrets.TL_ACC_NUM }}
          TL_ENV: ${{ secrets.TL_ENV }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TL_PAIR_MAP: ${{ secrets.TL_PAIR_MAP }}
          TL_DEFAULT_QTY: ${{ secrets.TL_DEFAULT_QTY }}
        run: |
          echo "=== Files before running bot ==="
          ls -la *.py 2>/dev/null || echo "No .py files found in root!"
          python3 tradelocker_bot.py

  # =================================================================
  # JOB 2: Dashboard Generator + GitHub Pages Deployment
  # =================================================================
  dashboard:
    runs-on: ubuntu-latest
    name: Update & Deploy Dashboard
    needs: bot  # Run after bot (optional, can be removed)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # 🔍 DEBUG: List all files
      - name: 🔍 Debug - List files in workspace
        run: |
          echo "=== Current branch ==="
          git branch --show-current
          echo ""
          echo "=== All files ==="
          ls -la
          echo ""
          echo "=== Python files ==="
          find . -name "*.py" -type f
          echo ""
          echo "=== docs folder ==="
          ls -la docs/ 2>/dev/null || echo "No docs folder yet"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate Dashboard HTML
        env:
          MODE: dashboard
          TL_EMAIL: ${{ secrets.TL_EMAIL }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_SERVER: ${{ secrets.TL_SERVER }}
          TL_ACCOUNT_ID: ${{ secrets.TL_ACCOUNT_ID }}
          TL_ACC_NUM: ${{ secrets.TL_ACC_NUM }}
          TL_ENV: ${{ secrets.TL_ENV }}
        run: |
          echo "=== Files before generating dashboard ==="
          ls -la *.py 2>/dev/null || echo "No .py files found in root!"
          python3 tradelocker_bot.py

      - name: Commit dashboard to main branch
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Dashboard Bot"
          git add docs/index.html || true
          git commit -m "Update dashboard $(date -u '+%Y-%m-%d %H:%M UTC')" || true
          git push || true

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
