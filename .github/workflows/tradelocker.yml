name: TradeLocker Bot & Dashboard

on:
  schedule:
    - cron: '3,33 * * * *'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    name: Execute Trading Bot
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run Trading Bot
        env:
          MODE: bot
          TL_EMAIL: ${{ secrets.TL_EMAIL }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_SERVER: ${{ secrets.TL_SERVER }}
          TL_ACCOUNT_ID: ${{ secrets.TL_ACCOUNT_ID }}
          TL_ACC_NUM: ${{ secrets.TL_ACC_NUM }}
          TL_ENV: ${{ secrets.TL_ENV }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TL_PAIR_MAP: ${{ secrets.TL_PAIR_MAP }}
          TL_DEFAULT_QTY: ${{ secrets.TL_DEFAULT_QTY }}
        run: python3 tradelocker_bot.py

  dashboard:
    runs-on: ubuntu-latest
    name: Update Dashboard
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Generate Dashboard
        env:
          MODE: dashboard
          TL_EMAIL: ${{ secrets.TL_EMAIL }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_SERVER: ${{ secrets.TL_SERVER }}
          TL_ACCOUNT_ID: ${{ secrets.TL_ACCOUNT_ID }}
          TL_ACC_NUM: ${{ secrets.TL_ACC_NUM }}
          TL_ENV: ${{ secrets.TL_ENV }}
        run: python3 tradelocker_bot.py
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true