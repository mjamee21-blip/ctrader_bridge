name: TradeLocker Bot & Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tradelocker
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    name: Execute Trading Bot
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Bot
        env:
          MODE: bot
          TL_EMAIL: ${{ secrets.TL_EMAIL }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_SERVER: ${{ secrets.TL_SERVER }}
          TL_ACCOUNT_ID: ${{ secrets.TL_ACCOUNT_ID }}
          TL_ACC_NUM: ${{ secrets.TL_ACC_NUM }}
          TL_ENV: ${{ secrets.TL_ENV }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TL_PAIR_MAP: ${{ secrets.TL_PAIR_MAP }}
          TL_DEFAULT_QTY: ${{ secrets.TL_DEFAULT_QTY }}
        run: python3 tradelocker_bot.py

  dashboard:
    runs-on: ubuntu-latest
    name: Update Dashboard
    needs: bot
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate Dashboard
        env:
          MODE: dashboard
          TL_EMAIL: ${{ secrets.TL_EMAIL }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_SERVER: ${{ secrets.TL_SERVER }}
          TL_ACCOUNT_ID: ${{ secrets.TL_ACCOUNT_ID }}
          TL_ACC_NUM: ${{ secrets.TL_ACC_NUM }}
          TL_ENV: ${{ secrets.TL_ENV }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          GH_OWNER: ${{ secrets.GH_OWNER }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_WORKFLOW: ${{ secrets.GH_WORKFLOW }}
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python3 tradelocker_bot.py

      - name: Commit and push dashboard
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Dashboard Bot"
          git add docs/ || true
          git commit -m "Dashboard update $(date -u '+%Y-%m-%d %H:%M UTC')" || true
          git push origin main || true
