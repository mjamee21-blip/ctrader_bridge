name: TradeLocker Bridge - 1 Minute Cron

on:
  schedule:
    # Run every 1 minute
    - cron: '* * * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  tradelocker-cron:
    runs-on: ubuntu-latest
    
    # Timeout to prevent hanging
    timeout-minutes: 2
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      
      # Step 3: Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
      
      # Step 4: Validate secrets are configured
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.TL_EMAIL }}" ] || [ -z "${{ secrets.TL_PASSWORD }}" ]; then
            echo "❌ CRITICAL: TL_EMAIL and TL_PASSWORD secrets are not configured!"
            echo "Go to: Settings → Secrets and variables → Actions"
            echo "Add the following secrets:"
            echo "  - TL_EMAIL (required)"
            echo "  - TL_PASSWORD (required)"
            echo "  - TL_SERVER (optional, default: TradeLocker-Demo)"
            echo "  - TL_ACCOUNT_ID (required)"
            echo "  - TL_ACC_NUM (optional, default: 1)"
            echo "  - TL_ENV (optional, default: demo)"
            echo "  - TG_TOKEN (required)"
            echo "  - TG_CHAT (required)"
            exit 1
          fi
          echo "✅ Secrets validated"
      
      # Step 5: Create .env1 file from GitHub secrets
      - name: Create .env1 configuration
        run: |
          cat > .env1 << EOF
          TL_EMAIL=${{ secrets.TL_EMAIL }}
          TL_PASSWORD=${{ secrets.TL_PASSWORD }}
          TL_SERVER=${{ secrets.TL_SERVER }}
          TL_ACCOUNT_ID=${{ secrets.TL_ACCOUNT_ID }}
          TL_ACC_NUM=${{ secrets.TL_ACC_NUM }}
          TL_ENV=${{ secrets.TL_ENV }}
          TL_BASE_URL=${{ secrets.TL_BASE_URL }}
          TL_DEFAULT_QTY=${{ secrets.TL_DEFAULT_QTY }}
          TG_TOKEN=${{ secrets.TG_TOKEN }}
          TG_CHAT=${{ secrets.TG_CHAT }}
          TL_PAIR_MAP=${{ secrets.TL_PAIR_MAP }}
          EOF
          # Ensure fallback defaults if values are empty
          [ -s .env1 ] || true
          sed -i 's/^TL_SERVER=$/TL_SERVER=TradeLocker-Demo/' .env1
          sed -i 's/^TL_ACCOUNT_ID=$/TL_ACCOUNT_ID=0/' .env1
          sed -i 's/^TL_ACC_NUM=$/TL_ACC_NUM=1/' .env1
          sed -i 's/^TL_ENV=$/TL_ENV=demo/' .env1
          sed -i 's/^TL_DEFAULT_QTY=$/TL_DEFAULT_QTY=0.10/' .env1
          chmod 600 .env1
          echo "✅ .env1 file created"
      
      # Step 6: Run the cron cycle
      - name: Run TradeLocker Bridge Cron
        env:
          TL_EMAIL: ${{ secrets.TL_EMAIL }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_SERVER: ${{ secrets.TL_SERVER }}
          TL_ACCOUNT_ID: ${{ secrets.TL_ACCOUNT_ID }}
          TL_ACC_NUM: ${{ secrets.TL_ACC_NUM }}
          TL_ENV: ${{ secrets.TL_ENV }}
          TL_BASE_URL: ${{ secrets.TL_BASE_URL }}
          TL_DEFAULT_QTY: ${{ secrets.TL_DEFAULT_QTY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TL_PAIR_MAP: ${{ secrets.TL_PAIR_MAP }}
        run: |
          python3 -c "
          import traceback
          import sys
          try:
              from tradelocker_bridge import run_cron_cycle
              success = run_cron_cycle()
              if not success:
                  print('❌ TradeLocker Bridge cron cycle returned False (authentication failed or execution error).')
                  sys.exit(1)
          except Exception as e:
              print('CRASH TRACEBACK:')
              traceback.print_exc()
              raise e
          "
        timeout-minutes: 1
      
      # Step 7: Notify on failure
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ TradeLocker Bridge cron job failed"
          echo "Run: ${{ github.run_number }}"
          echo "Check the logs above for details"
          echo ""
          echo "Common causes:"
          echo "1. Secrets not configured in Settings → Secrets and variables → Actions"
          echo "2. TradeLocker credentials expired or invalid"
          echo "3. Telegram bot token invalid"
          echo "4. Network connectivity issues to TradeLocker API"
      
