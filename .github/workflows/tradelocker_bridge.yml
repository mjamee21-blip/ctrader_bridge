name: TradeLocker Bridge - 1 Minute Cron

on:
  schedule:
    # Run every 1 minute
    - cron: '* * * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  tradelocker-cron:
    runs-on: ubuntu-latest
    
    # Timeout to prevent hanging
    timeout-minutes: 2
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      
      # Step 3: Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
      
      # Step 4: Validate secrets are configured
      - name: Validate secrets
        run: |
          missing=0
          for var in TL_EMAIL TL_PASSWORD TL_ACCOUNT_ID TL_SERVER; do
            val="${{ secrets[var] }}"
            if [ -z "$val" ]; then
              echo "❌ CRITICAL: $var secret is not configured or is empty!"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "Go to: Settings → Secrets and variables → Actions"
            echo "Required secrets:"
            echo "  - TL_EMAIL (your TradeLocker login email)"
            echo "  - TL_PASSWORD (your TradeLocker login password)"
            echo "  - TL_SERVER (your broker server name, e.g. TradeLocker-Demo)"
            echo "  - TL_ACCOUNT_ID (your TradeLocker account number)"
            exit 1
          fi
          echo "✅ All required secrets validated"
      
      # Step 5: Debug - verify environment variables exist
      - name: Debug environment variables
        env:
          TL_EMAIL: ${{ secrets.TL_EMAIL }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_SERVER: ${{ secrets.TL_SERVER }}
          TL_ACCOUNT_ID: ${{ secrets.TL_ACCOUNT_ID }}
          TL_ACC_NUM: ${{ secrets.TL_ACC_NUM }}
          TL_ENV: ${{ secrets.TL_ENV }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          echo "🔍 Checking environment variables..."
          echo "Git commit: $(git rev-parse HEAD)"
          if [ -n "$TL_EMAIL" ]; then echo "TL_EMAIL: present"; else echo "TL_EMAIL: EMPTY/MISSING"; fi
          if [ -n "$TL_PASSWORD" ]; then echo "TL_PASSWORD: present"; else echo "TL_PASSWORD: EMPTY/MISSING"; fi
          if [ -n "$TL_SERVER" ]; then echo "TL_SERVER: $TL_SERVER"; else echo "TL_SERVER: EMPTY/MISSING"; fi
          if [ -n "$TL_ACCOUNT_ID" ]; then echo "TL_ACCOUNT_ID: $TL_ACCOUNT_ID"; else echo "TL_ACCOUNT_ID: EMPTY/MISSING"; fi
          if [ -n "$TL_ACC_NUM" ]; then echo "TL_ACC_NUM: $TL_ACC_NUM"; else echo "TL_ACC_NUM: EMPTY/MISSING"; fi
          if [ -n "$TL_ENV" ]; then echo "TL_ENV: $TL_ENV"; else echo "TL_ENV: EMPTY/MISSING"; fi
          if [ -n "$TG_TOKEN" ]; then echo "TG_TOKEN: present"; else echo "TG_TOKEN: EMPTY/MISSING"; fi
          if [ -n "$TG_CHAT" ]; then echo "TG_CHAT: $TG_CHAT"; else echo "TG_CHAT: EMPTY/MISSING"; fi
       
      # Step 6: Run the cron cycle with full Python debug
      - name: Run TradeLocker Bridge Cron
        env:
          TL_EMAIL: ${{ secrets.TL_EMAIL }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_SERVER: ${{ secrets.TL_SERVER }}
          TL_ACCOUNT_ID: ${{ secrets.TL_ACCOUNT_ID }}
          TL_ACC_NUM: ${{ secrets.TL_ACC_NUM }}
          TL_ENV: ${{ secrets.TL_ENV }}
          TL_BASE_URL: ${{ secrets.TL_BASE_URL }}
          TL_DEFAULT_QTY: ${{ secrets.TL_DEFAULT_QTY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TL_PAIR_MAP: ${{ secrets.TL_PAIR_MAP }}
        run: |
          python3 -c "
          import os, traceback, sys
          print('🔍 Python env vars check:')
          for key in ['TL_EMAIL','TL_PASSWORD','TL_SERVER','TL_ACCOUNT_ID','TL_ACC_NUM','TL_ENV','TG_TOKEN','TG_CHAT']:
              val = os.environ.get(key, '')
              print(f'  {key}: {\"***present*** (len=\" + str(len(val)) + \")\" if val else \"EMPTY/MISSING\"}'  )
          try:
              from tradelocker_bridge import run_cron_cycle
              success = run_cron_cycle()
              if not success:
                  print('❌ TradeLocker Bridge cron cycle returned False (authentication failed or execution error).')
                  sys.exit(1)
          except Exception as e:
              print('CRASH TRACEBACK:')
              traceback.print_exc()
              raise e
          "
        timeout-minutes: 1
       
      # Step 8: Show debug logs on failure
      - name: Show debug logs on failure
        if: failure()
        run: |
          echo "==== DEBUG: Python env vars check ===="
          if [ -n "$TL_EMAIL" ]; then echo "TL_EMAIL: present"; else echo "TL_EMAIL: EMPTY/MISSING"; fi
          if [ -n "$TL_PASSWORD" ]; then echo "TL_PASSWORD: present"; else echo "TL_PASSWORD: EMPTY/MISSING"; fi
          if [ -n "$TL_SERVER" ]; then echo "TL_SERVER: $TL_SERVER"; else echo "TL_SERVER: EMPTY/MISSING"; fi
          if [ -n "$TL_ACCOUNT_ID" ]; then echo "TL_ACCOUNT_ID: $TL_ACCOUNT_ID"; else echo "TL_ACCOUNT_ID: EMPTY/MISSING"; fi
          if [ -n "$TL_ACC_NUM" ]; then echo "TL_ACC_NUM: $TL_ACC_NUM"; else echo "TL_ACC_NUM: EMPTY/MISSING"; fi
          if [ -n "$TL_ENV" ]; then echo "TL_ENV: $TL_ENV"; else echo "TL_ENV: EMPTY/MISSING"; fi
          if [ -n "$TG_TOKEN" ]; then echo "TG_TOKEN: present"; else echo "TG_TOKEN: EMPTY/MISSING"; fi
          if [ -n "$TG_CHAT" ]; then echo "TG_CHAT: $TG_CHAT"; else echo "TG_CHAT: EMPTY/MISSING"; fi
          echo ""
          echo "==== DEBUG: Bridge log file (last 100 lines) ===="
          if [ -f tradelocker_bridge.log ]; then
            tail -n 100 tradelocker_bridge.log || true
          else
            echo "tradelocker_bridge.log not found"
          fi
          echo ""
          echo "==== DEBUG: Status file ===="
          if [ -f tradelocker_status.json ]; then
            cat tradelocker_status.json || true
          else
            echo "tradelocker_status.json not found"
          fi
          echo ""
          echo "==== DEBUG: Crash log file ===="
          if [ -f tradelocker_crash.log ]; then
            cat tradelocker_crash.log || true
          else
            echo "tradelocker_crash.log not found"
          fi
       
      # Step 9: Notify on failure
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ TradeLocker Bridge cron job failed"
          echo "Run: ${{ github.run_number }}"
          echo "Check the 'Show debug logs on failure' step above for detailed error output."
          echo ""
          echo "Common causes:"
          echo "1. Secrets not configured in Settings → Secrets and variables → Actions"
          echo "2. TradeLocker credentials expired or invalid (check TL_EMAIL, TL_PASSWORD, TL_SERVER, TL_ACCOUNT_ID)"
          echo "3. Telegram bot token invalid"
          echo "4. Network connectivity issues to TradeLocker API"
      
