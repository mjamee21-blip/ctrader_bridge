<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cTrader Dashboard - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .login-box h1 { color: #60a5fa; margin-bottom: 10px; font-size: 24px; }
        .login-box p { color: #94a3b8; margin-bottom: 25px; font-size: 13px; }
        .error { color: #ef4444; font-size: 12px; padding: 10px; background: #ef44441a; border-radius: 4px; margin-bottom: 15px; display: none; }
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #94a3b8; font-size: 12px; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; font-size: 13px; }
        input:focus { outline: none; border-color: #60a5fa; }
        button { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
        button:hover { background: #2563eb; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 cTrader Dashboard</h1>
        <p>Enter your credentials to continue</p>
        <div class="error" id="error"></div>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
    </div>

    <script>
        const VALID_USER = "admin";
        const VALID_PASS = "password123";

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === VALID_USER && pass === VALID_PASS) {
                sessionStorage.setItem('auth', 'true');
                window.location.href = 'index.html';
            } else {
                document.getElementById('error').textContent = '❌ Invalid username or password';
                document.getElementById('error').style.display = 'block';
                document.getElementById('password').value = '';
            }
        }

        if (sessionStorage.getItem('auth') === 'true') {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
